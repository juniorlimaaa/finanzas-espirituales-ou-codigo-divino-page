<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" width="100%" height="100%">
  <defs>
    <!-- Background shadows -->
    <filter id="book-shadow" x="-20%" y="-10%" width="150%" height="140%">
      <feDropShadow dx="30" dy="40" stdDeviation="35" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="10" dy="15" stdDeviation="15" flood-color="#D4AF37" flood-opacity="0.15" />
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="cover-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1738" />
      <stop offset="50%" stop-color="#060e24" />
      <stop offset="100%" stop-color="#030713" />
    </linearGradient>
    <linearGradient id="spine-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#040916" />
      <stop offset="40%" stop-color="#0c1d47" />
      <stop offset="80%" stop-color="#050c1e" />
      <stop offset="100%" stop-color="#02050e" />
    </linearGradient>
    <linearGradient id="gold-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE08B" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFF6D1" />
      <stop offset="75%" stop-color="#AA820A" />
      <stop offset="100%" stop-color="#F3E5AB" />
    </linearGradient>
    <linearGradient id="gold-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF4D0" />
      <stop offset="100%" stop-color="#C89B2B" />
    </linearGradient>
    <radialGradient id="sacred-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFEDB3" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#D4AF37" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#AA820A" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 3D Spine and Pages Perspective Group -->
  <g filter="url(#book-shadow)" transform="translate(80, 50)">
    
    <!-- Left Spine -->
    <path d="M110,60 L180,75 L180,885 L110,870 Z" fill="url(#spine-grad)" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.4" />
    <!-- Spine Gold Details -->
    <line x1="115" y1="100" x2="175" y2="112" stroke="url(#gold-metal)" stroke-width="2" />
    <line x1="115" y1="106" x2="175" y2="118" stroke="url(#gold-metal)" stroke-width="1" />
    
    <!-- Spine Vertical Text -->
    <g transform="translate(148, 480) rotate(-90)">
      <text text-anchor="middle" font-family="'Cinzel', serif" font-size="24" font-weight="bold" fill="url(#gold-metal)" letter-spacing="5">
        FINANZAS ESPIRITUALES
      </text>
    </g>
    
    <line x1="115" y1="830" x2="175" y2="842" stroke="url(#gold-metal)" stroke-width="1" />
    <line x1="115" y1="836" x2="175" y2="848" stroke="url(#gold-metal)" stroke-width="2" />

    <!-- Main Front Cover -->
    <path d="M180,75 L710,75 L710,885 L180,885 Z" fill="url(#cover-grad)" stroke="#D4AF37" stroke-width="2.5" />

    <!-- Outer Gold Filigree Border -->
    <rect x="205" y="100" width="480" height="760" rx="6" fill="none" stroke="url(#gold-metal)" stroke-width="3" />
    <rect x="215" y="110" width="460" height="740" rx="4" fill="none" stroke="url(#gold-metal)" stroke-width="1" stroke-dasharray="12,4" opacity="0.7" />

    <!-- Ornate Corner Motifs -->
    <!-- Top Left -->
    <g transform="translate(220, 115)">
      <path d="M0,35 Q0,0 35,0 M10,35 Q10,10 35,10 M0,20 Q20,20 20,0" fill="none" stroke="url(#gold-metal)" stroke-width="2" />
      <circle cx="15" cy="15" r="3" fill="url(#gold-metal)" />
    </g>
    <!-- Top Right -->
    <g transform="translate(670, 115) scale(-1, 1)">
      <path d="M0,35 Q0,0 35,0 M10,35 Q10,10 35,10 M0,20 Q20,20 20,0" fill="none" stroke="url(#gold-metal)" stroke-width="2" />
      <circle cx="15" cy="15" r="3" fill="url(#gold-metal)" />
    </g>
    <!-- Bottom Left -->
    <g transform="translate(220, 845) scale(1, -1)">
      <path d="M0,35 Q0,0 35,0 M10,35 Q10,10 35,10 M0,20 Q20,20 20,0" fill="none" stroke="url(#gold-metal)" stroke-width="2" />
      <circle cx="15" cy="15" r="3" fill="url(#gold-metal)" />
    </g>
    <!-- Bottom Right -->
    <g transform="translate(670, 845) scale(-1, -1)">
      <path d="M0,35 Q0,0 35,0 M10,35 Q10,10 35,10 M0,20 Q20,20 20,0" fill="none" stroke="url(#gold-metal)" stroke-width="2" />
      <circle cx="15" cy="15" r="3" fill="url(#gold-metal)" />
    </g>

    <!-- Book Title & Typography -->
    <g text-anchor="middle">
      <!-- Main Title -->
      <text x="445" y="205" font-family="'Cinzel', 'Playfair Display', serif" font-size="42" font-weight="900" fill="url(#gold-light)" letter-spacing="3" filter="drop-shadow(0 2px 8px rgba(212,175,55,0.4))">
        FINANZAS
      </text>
      <text x="445" y="260" font-family="'Cinzel', 'Playfair Display', serif" font-size="36" font-weight="800" fill="url(#gold-light)" letter-spacing="4" filter="drop-shadow(0 2px 8px rgba(212,175,55,0.4))">
        ESPIRITUALES
      </text>

      <!-- Subtitle -->
      <text x="445" y="305" font-family="'Inter', sans-serif" font-size="14" font-weight="500" fill="#F3E5AB" letter-spacing="1.5">
        Principios bíblicos para una
      </text>
      <text x="445" y="328" font-family="'Inter', sans-serif" font-size="14" font-weight="500" fill="#F3E5AB" letter-spacing="1.5">
        vida financiera abundante
      </text>
    </g>

    <!-- Sacred Symbols: Menorah, Tree of Life, Cross -->
    <g transform="translate(445, 410)">
      <!-- Menorah (Left) -->
      <g transform="translate(-120, -10) scale(0.9)">
        <path d="M0,40 L0,0 M-30,5 C-30,25 -10,35 0,35 C10,35 30,25 30,5 M-20,12 C-20,24 -7,30 0,30 C7,30 20,24 20,12 M-10,18 C-10,24 -4,27 0,27 C4,27 10,24 10,18 M-35,42 L35,42 M-15,48 L15,48" fill="none" stroke="url(#gold-metal)" stroke-width="2" stroke-linecap="round" />
        <circle cx="-30" cy="2" r="2.5" fill="#FFF6D1" />
        <circle cx="-20" cy="9" r="2.5" fill="#FFF6D1" />
        <circle cx="-10" cy="15" r="2.5" fill="#FFF6D1" />
        <circle cx="0" cy="-3" r="3" fill="#FFF6D1" />
        <circle cx="10" cy="15" r="2.5" fill="#FFF6D1" />
        <circle cx="20" cy="9" r="2.5" fill="#FFF6D1" />
        <circle cx="30" cy="2" r="2.5" fill="#FFF6D1" />
      </g>

      <!-- Tree of Life (Center) -->
      <g transform="translate(0, 0)">
        <circle cx="0" cy="15" r="38" fill="none" stroke="url(#gold-metal)" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.5" />
        <!-- Trunk -->
        <path d="M-4,35 Q-2,15 -10,5 Q-4,10 0,0 Q4,10 10,5 Q2,15 4,35 Z" fill="url(#gold-metal)" />
        <!-- Branches & Leaves -->
        <circle cx="0" cy="-5" r="7" fill="url(#gold-metal)" opacity="0.9" />
        <circle cx="-16" cy="0" r="6" fill="url(#gold-metal)" opacity="0.85" />
        <circle cx="16" cy="0" r="6" fill="url(#gold-metal)" opacity="0.85" />
        <circle cx="-24" cy="12" r="5" fill="url(#gold-metal)" opacity="0.8" />
        <circle cx="24" cy="12" r="5" fill="url(#gold-metal)" opacity="0.8" />
        <circle cx="-10" cy="-14" r="5" fill="url(#gold-metal)" opacity="0.85" />
        <circle cx="10" cy="-14" r="5" fill="url(#gold-metal)" opacity="0.85" />
        <circle cx="0" cy="-20" r="4" fill="url(#gold-metal)" opacity="0.9" />
      </g>

      <!-- Latin Cross (Right) -->
      <g transform="translate(120, 10)">
        <path d="M-4,-25 L4,-25 L4,-8 L18,-8 L18,0 L4,0 L4,30 L-4,30 L-4,0 L-18,0 L-18,-8 L-4,-8 Z" fill="url(#gold-metal)" filter="drop-shadow(0 0 5px rgba(253,224,139,0.5))" />
      </g>
    </g>

    <!-- Holy Scripture Open Scroll with Glowing Radiance -->
    <!-- Light Glow -->
    <circle cx="445" cy="620" r="160" fill="url(#sacred-glow)" filter="url(#glow)" />

    <!-- Radiant Rays -->
    <g stroke="url(#gold-metal)" stroke-width="1.5" opacity="0.4">
      <line x1="445" y1="620" x2="280" y2="500" />
      <line x1="445" y1="620" x2="340" y2="460" />
      <line x1="445" y1="620" x2="445" y2="450" />
      <line x1="445" y1="620" x2="550" y2="460" />
      <line x1="445" y1="620" x2="610" y2="500" />
      <line x1="445" y1="620" x2="640" y2="570" />
      <line x1="445" y1="620" x2="250" y2="570" />
    </g>

    <!-- 3D Open Scripture Scroll -->
    <g transform="translate(445, 620)">
      <!-- Left Roll Handle -->
      <rect x="-195" y="-85" width="20" height="170" rx="5" fill="url(#gold-metal)" stroke="#8B6807" stroke-width="1" />
      <circle cx="-185" cy="-90" r="10" fill="url(#gold-metal)" />
      <circle cx="-185" cy="90" r="10" fill="url(#gold-metal)" />

      <!-- Right Roll Handle -->
      <rect x="175" y="-85" width="20" height="170" rx="5" fill="url(#gold-metal)" stroke="#8B6807" stroke-width="1" />
      <circle cx="185" cy="-90" r="10" fill="url(#gold-metal)" />
      <circle cx="185" cy="90" r="10" fill="url(#gold-metal)" />

      <!-- Left Page Parchment -->
      <path d="M-175,-75 Q-85,-95 0,-80 L0,75 Q-85,60 -175,80 Z" fill="#FFF4D2" stroke="#D4AF37" stroke-width="2" />
      <!-- Left Page Scripture Text Simulation -->
      <g stroke="#7E621E" stroke-width="1.5" opacity="0.6" stroke-linecap="round">
        <line x1="-155" y1="-60" x2="-20" y2="-65" />
        <line x1="-155" y1="-45" x2="-20" y2="-50" />
        <line x1="-155" y1="-30" x2="-20" y2="-35" />
        <line x1="-155" y1="-15" x2="-20" y2="-20" />
        <line x1="-155" y1="0" x2="-20" y2="-5" />
        <line x1="-155" y1="15" x2="-20" y2="10" />
        <line x1="-155" y1="30" x2="-20" y2="25" />
        <line x1="-155" y1="45" x2="-40" y2="40" />
      </g>

      <!-- Right Page Parchment -->
      <path d="M0,-80 Q85,-95 175,-75 L175,80 Q85,60 0,75 Z" fill="#FFF9E6" stroke="#D4AF37" stroke-width="2" />
      <!-- Right Page Scripture Text Simulation -->
      <g stroke="#7E621E" stroke-width="1.5" opacity="0.6" stroke-linecap="round">
        <line x1="20" y1="-65" x2="155" y2="-60" />
        <line x1="20" y1="-50" x2="155" y2="-45" />
        <line x1="20" y1="-35" x2="155" y2="-30" />
        <line x1="20" y1="-20" x2="155" y2="-15" />
        <line x1="20" y1="-5" x2="155" y2="0" />
        <line x1="20" y1="10" x2="155" y2="15" />
        <line x1="20" y1="25" x2="155" y2="30" />
        <line x1="20" y1="40" x2="130" y2="45" />
      </g>

      <!-- Center Fold Shadow -->
      <path d="M-5,-80 L5,-80 L5,75 L-5,75 Z" fill="#9A7922" opacity="0.35" />
    </g>

    <!-- Bottom Badge -->
    <g text-anchor="middle">
      <rect x="300" y="785" width="290" height="35" rx="17.5" fill="#060B19" stroke="url(#gold-metal)" stroke-width="1.5" />
      <text x="445" y="808" font-family="'Cinzel', serif" font-size="14" font-weight="bold" fill="url(#gold-light)" letter-spacing="2">
        EDICIÓN COMPLETA Y REVELADA
      </text>
    </g>

  </g>
</svg>