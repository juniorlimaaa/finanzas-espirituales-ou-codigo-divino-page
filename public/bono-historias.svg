  </g>

  <rect x="80" y="480" width="240" height="34" rx="17" fill="#2C210C" stroke="#FFEBB0" stroke-width="1.5" />
  <text x="200" y="502" font-family="'Cinzel', serif" font-size="12" font-weight="bold" fill="#FFEBB0" text-anchor="middle" letter-spacing="2">VALOR: 9.00 USD • HOY GRATIS</text>
